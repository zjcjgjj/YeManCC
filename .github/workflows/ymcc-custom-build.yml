name: YMCC AIR PLUS Custom Build (Font Scale + AYANEO Dedicated Keys)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  pnpm_config_verify_deps_before_run: 'false'
  YEMAN_WORKSPACE_ROOT: ${{ github.workspace }}/../_ymcc_build_ws

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm 11.16.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Setup .NET 10 SDK (exact 10.0.400 per global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Setup MSVC x64 (official action, preserves dotnet PATH)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Provide BuildTools compatibility entrypoints for frozen build_native.bat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installation = $env:VSINSTALLDIR
          if (-not $installation -or -not (Test-Path -LiteralPath $installation -PathType Container)) {
            $locator = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $installation = (& $locator -latest -prerelease -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          }
          if (-not $installation) { throw 'No MSVC toolchain found.' }
          $actualRoot = Join-Path $installation 'VC\Auxiliary\Build'
          $legacyRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build'
          foreach ($name in @('vcvars32.bat','vcvars64.bat')) {
            $actual = Join-Path $actualRoot $name
            $legacy = Join-Path $legacyRoot $name
            if (-not (Test-Path -LiteralPath $actual -PathType Leaf)) { throw "Missing MSVC entrypoint: $actual" }
            if (-not (Test-Path -LiteralPath $legacy -PathType Leaf)) {
              New-Item -ItemType Directory -Path $legacyRoot -Force | Out-Null
              $shim = "@echo off`r`ncall `"$actual`" %*`r`nexit /b %errorlevel%`r`n"
              [IO.File]::WriteAllText($legacy, $shim, [Text.Encoding]::ASCII)
            }
          }
          $probe = Join-Path $env:RUNNER_TEMP 'probe-x64.cmd'
          $entry = Join-Path $legacyRoot 'vcvars64.bat'
          [IO.File]::WriteAllText($probe, "@echo off`r`ncall `"$entry`"`r`nif errorlevel 1 exit /b 1`r`nwhere cl.exe`r`nexit /b %errorlevel%`r`n", [Text.Encoding]::ASCII)
          & $env:ComSpec /d /c $probe
          if ($LASTEXITCODE -ne 0) { throw 'MSVC x64 entrypoint probe failed.' }
          'Platform=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed.' }

      - name: Verify toolchain and generate version source
        shell: pwsh
        run: |
          "dotnet=$(dotnet --version)"
          node scripts/write-version.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Version source generation failed.' }
          pnpm run type-check
          if ($LASTEXITCODE -ne 0) { throw 'Type check failed.' }

      - name: Build and package (FastRelease)
        shell: pwsh
        run: |
          & tools/publish.ps1 -WorkspaceRoot $env:YEMAN_WORKSPACE_ROOT -FastRelease
          if ($LASTEXITCODE -ne 0) { throw 'Build/package failed.' }

      - name: Verify artifact
        shell: pwsh
        run: |
          $zip = Join-Path $env:YEMAN_WORKSPACE_ROOT 'Release\Packages\YeManCC.zip'
          if (!(Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'YeManCC.zip not found.' }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          $size = (Get-Item -LiteralPath $zip).Length
          "ZIP: $zip"
          "Size: $size bytes"
          "SHA256: $hash"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YeManCC-AIRPLUS-custom
          path: ${{ env.YEMAN_WORKSPACE_ROOT }}/Release/Packages/YeManCC.zip
          if-no-files-found: error
          retention-days: 30
